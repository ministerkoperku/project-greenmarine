plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
version = project.mod_version
group = 'com.koper.greenmarine'
base { archivesName = 'greenmarine-development-tools' }
repositories { mavenCentral() }
def developmentProbe = providers.gradleProperty('developmentProbe').isPresent()
if (developmentProbe) {
    sourceSets {
        probe {
            java.setSrcDirs(['src/probe/java'])
            resources.setSrcDirs(['src/probe/resources'])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
}
def greenmarineJar = providers.gradleProperty('greenmarineJar').map { file(it) }
    .getOrElse(file('../build/libs/greenmarine-0.9.11-prototype.jar'))
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly files(greenmarineJar)
    testImplementation files(greenmarineJar)
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.luaj:luaj-jse:3.0.1'
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
tasks.named('test') {
    useJUnitPlatform(); jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (providers.gradleProperty('developmentGpuTest').isPresent()) systemProperty 'greenmarine.development.gpu', 'true'
    if (providers.gradleProperty('irisPack').isPresent()) systemProperty 'greenmarine.iris.pack', providers.gradleProperty('irisPack').get()
}
tasks.register('irisConverterDistribution', Zip) {
    dependsOn tasks.named('jar')
    archiveFileName = "greenmarine-iris-converter-${project.version}-${System.getProperty('os.arch')}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar')) { into 'lib' }
    from(greenmarineJar) { into 'lib' }
    from({ configurations.runtimeClasspath.files.findAll { it.name ==~ /lwjgl(-shaderc)?-[0-9].*\.jar/ } }) { into 'lib' }
    from('tools/iris-import.sh')
    from('IRIS-IMPORT.md')
    from('CONVERTER-README.txt') { rename { 'README.txt' } }
    from('../LICENSE')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
loom {
    mods {
        greenmarine_development { sourceSet sourceSets.main }
        if (developmentProbe) greenmarine_development_probe { sourceSet sourceSets.probe }
    }
    runs {
        client {
            programArgs '--graphicsBackend', 'vulkan', '--width', '960', '--height', '540'
            runDir providers.gradleProperty('probeRunDir').getOrElse('run')
            if (developmentProbe) {
                source sourceSets.probe
                if (providers.gradleProperty('workspaceProbe').isPresent()) {
                    vmArg '-Dgreenmarine.development.workspaceProbe=true'
                    vmArg '-Xmx1024m'
                    vmArg '-XX:ActiveProcessorCount=2'
                }
                vmArg '-Dgreenmarine.development.probe.output=' + providers.gradleProperty('probeOutput').getOrElse('probe-output')
            }
            vmArg '--enable-native-access=ALL-UNNAMED'
        }
    }
}
tasks.register('irisCoverage', JavaExec) {
    description = 'IR-1: translate+compile every program of an Iris pack. -PirisPack=<dir|zip> [-PirisDump=<dir>]'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.koper.greenmarine.development.iris.IrisCoverage'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('irisPack').getOrElse('')
    if (providers.gradleProperty('irisDump').isPresent()) args providers.gradleProperty('irisDump').get()
}

// Embed the renderer's current authoring sources; never maintain a second API/doc copy.
def shaderSdkResources = layout.buildDirectory.dir('generated/shader-sdk')
def sdkRepositoryFiles = fileTree('..') {
    include 'docs/*.md'
    include 'src/main/resources/assets/greenmarine/shaders/include/*.glsl'
    include 'src/main/java/com/koper/greenmarine/api/**/*.java'
    include 'src/main/resources/assets/greenmarine/greenmarine/packs/raster.json'
    include 'src/main/resources/assets/greenmarine/shaders/core/seabreeze_terrain.vsh'
    include 'src/main/resources/assets/greenmarine/shaders/core/raster_terrain.fsh'
    include 'src/main/resources/assets/greenmarine/shaders/core/seabreeze_sky.fsh'
    include 'src/main/resources/assets/greenmarine/shaders/core/seabreeze_clouds.fsh'
    include 'src/samples/resources/assets/greenmarine/greenmarine/packs/portable.json'
    include 'src/samples/resources/assets/greenmarine/greenmarine/scripts/portable.lua'
    include 'src/samples/resources/assets/greenmarine/shaders/core/pack_grade.fsh'
    include 'src/samples/resources/assets/greenmarine/shaders/core/pack_lightmap.fsh'
}
tasks.register('generateShaderSdk') {
    inputs.files(sdkRepositoryFiles)
    outputs.dir(shaderSdkResources)
    doLast {
        def root = shaderSdkResources.get().asFile
        delete root
        copy { from sdkRepositoryFiles; into new File(root, 'greenmarine-sdk/repository') }
        def repository = file('../').toPath().toAbsolutePath().normalize()
        def rows = sdkRepositoryFiles.files.collect { source ->
            def id = repository.relativize(source.toPath().toAbsolutePath().normalize()).toString().replace(File.separatorChar, '/' as char)
            def category = id.startsWith('docs/') ? 'Documentation' : id.endsWith('.java') ? 'Java-only API' : id.contains('/include/') ? 'GLSL include' : 'Repository example'
            id + '\t' + source.name + '\t' + category
        }.sort()
        new File(root, 'greenmarine-sdk/index.tsv').setText(rows.join('\n') + '\n', 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(shaderSdkResources)
tasks.named('processResources') { dependsOn tasks.named('generateShaderSdk') }
tasks.named('sourcesJar') { dependsOn tasks.named('generateShaderSdk') }
